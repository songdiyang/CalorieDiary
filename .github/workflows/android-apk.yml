name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      VISION_PROXY_URL: ${{ vars.VISION_PROXY_URL || secrets.VISION_PROXY_URL }}
      VISION_APP_KEY: ${{ vars.VISION_APP_KEY || secrets.VISION_APP_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 固定签名所需的仓库 Secrets：
      #   SIGNING_KEYSTORE_BASE64  release keystore 的 base64 文本
      #   SIGNING_STORE_PASSWORD   keystore 密码
      #   SIGNING_KEY_ALIAS        密钥别名
      #   SIGNING_KEY_PASSWORD     密钥密码
      #   SIGNING_STORE_TYPE       可选：JKS / PKCS12
      # 未配置 keystore 时回退 debug 构建，便于本地/PR 调试。
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          STORE_TYPE: ${{ secrets.SIGNING_STORE_TYPE }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "SIGNING_KEYSTORE_BASE64 未配置，回退 Debug 构建"
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            exit 0
          fi
          for var in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "缺少签名 secret: $var" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          test -s "$keystore"
          {
            printf 'signing.storeFile=%s\n' "$keystore"
            printf 'signing.storePassword=%s\n' "$STORE_PASSWORD"
            printf 'signing.keyAlias=%s\n' "$KEY_ALIAS"
            printf 'signing.keyPassword=%s\n' "$KEY_PASSWORD"
            if [ -n "${STORE_TYPE:-}" ]; then
              printf 'signing.storeType=%s\n' "$STORE_TYPE"
            fi
          } >> local.properties
          echo "HAS_SIGNING=true" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -euo pipefail
          if [ "${HAS_SIGNING:-false}" = "true" ]; then
            bash ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Stage APK
        run: |
          set -euo pipefail
          if [ "${HAS_SIGNING:-false}" = "true" ]; then
            src="app/build/outputs/apk/release/app-release.apk"
            build_type="release"
          else
            src="app/build/outputs/apk/debug/app-debug.apk"
            build_type="debug"
          fi
          test -s "$src"
          mkdir -p dist
          cp "$src" "dist/CalorieDiary-${build_type}.apk"
          sha256sum "dist/CalorieDiary-${build_type}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: CalorieDiary-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish APK Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: CalorieDiary-apk-${{ github.run_number }}
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          asset=$(find release -type f -name '*.apk' | head -n1)
          test -n "$asset"
          asset_name=$(basename "$asset")
          case "$asset_name" in
            *-release.apk) build_label="Release" ;;
            *) build_label="Debug" ;;
          esac

          version_name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          version_code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          test -n "$version_name"
          test -n "$version_code"
          # 每个版本一个独立 Release：0.25 -> v0.25-37，0.26 -> v0.26-38
          tag="v${version_name}-${version_code}"

          checksum=$(sha256sum "$asset" | cut -d' ' -f1)
          size=$(stat -c %s "$asset")
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            if [ "$build_label" = "Release" ]; then
              printf '自动构建的 Release APK（固定签名）。\n\n'
            else
              printf '自动构建的 Debug APK（非商店正式版）。\n\n'
            fi
            printf '版本: %s (%s)\n' "$version_name" "$version_code"
            printf '提交: %s\n' "$GITHUB_SHA"
            printf '大小: %s 字节\n' "$size"
            printf 'SHA-256: %s\n' "$checksum"
            printf '构建记录: %s\n' "$run_url"
          } > release/notes.md
          title="v${version_name} (${version_code}) · ${build_label} 构建 #${RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            while IFS= read -r old_asset; do
              [ -n "$old_asset" ] || continue
              [ "$old_asset" = "$asset_name" ] && continue
              case "$old_asset" in
                *.apk) gh release delete-asset "$tag" "$old_asset" --yes ;;
              esac
            done < <(gh release view "$tag" --json assets --jq '.assets[].name')
            gh release edit "$tag" --title "$title" --notes-file release/notes.md --latest
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --title "$title" --notes-file release/notes.md --latest
          fi

  deploy:
    name: Deploy Update Manifest
    needs: [build, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: CalorieDiary-apk-${{ github.run_number }}
          path: artifact

      - name: Prepare update manifest
        env:
          PUBLIC_BASE_URL: https://caloriediary.aetherstudio.cn
        run: |
          set -euo pipefail
          apk=$(find artifact -type f -name 'CalorieDiary-release.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "当前构建不是固定签名的 Release 包，跳过自动部署"
            echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
            exit 0
          fi
          version_name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          version_code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          test -n "$version_name"
          test -n "$version_code"
          tag="v${version_name}-${version_code}"
          apk_name="CalorieDiary-${version_name}-${version_code}-${GITHUB_RUN_NUMBER}-release.apk"
          cp "$apk" "$apk_name"
          checksum=$(sha256sum "$apk_name" | cut -d' ' -f1)
          size=$(stat -c %s "$apk_name")
          size_label=$(awk "BEGIN { printf \"%.1f MB\", $size / 1048576 }")
          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          jq -n \
            --arg version "$version_name" \
            --argjson versionCode "$version_code" \
            --argjson build "$GITHUB_RUN_NUMBER" \
            --arg channel "release" \
            --arg releasedAt "$(date -u +%F)" \
            --arg size "$size_label" \
            --argjson sizeBytes "$size" \
            --arg downloadUrl "${PUBLIC_BASE_URL}/downloads/${apk_name}" \
            --arg releaseUrl "$release_url" \
            --arg sha256 "$checksum" \
            '{version:$version, versionCode:$versionCode, build:$build, channel:$channel, releasedAt:$releasedAt, size:$size, sizeBytes:$sizeBytes, downloadUrl:$downloadUrl, releaseUrl:$releaseUrl, sha256:$sha256, releaseNotes:[]}' > version.json
          cat version.json
          echo "APK_FILE=$apk_name" >> "$GITHUB_ENV"
          echo "SKIP_DEPLOY=false" >> "$GITHUB_ENV"

      - name: Install deploy key
        if: env.SKIP_DEPLOY != 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload APK and manifest
        if: env.SKIP_DEPLOY != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          scp_opts=(-i ~/.ssh/deploy_key -P "$port" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes)
          ssh_opts=(-i ~/.ssh/deploy_key -p "$port" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes)
          # APK 先就位，最后替换 version.json，避免客户端读到不一致的清单
          scp "${scp_opts[@]}" "$APK_FILE" "$target:$DEPLOY_PATH/downloads/.deploy-$APK_FILE.tmp"
          ssh "${ssh_opts[@]}" "$target" "mv -f '$DEPLOY_PATH/downloads/.deploy-$APK_FILE.tmp' '$DEPLOY_PATH/downloads/$APK_FILE' && chmod 644 '$DEPLOY_PATH/downloads/$APK_FILE'"
          scp "${scp_opts[@]}" version.json "$target:$DEPLOY_PATH/.version.json.tmp"
          ssh "${ssh_opts[@]}" "$target" "mv -f '$DEPLOY_PATH/.version.json.tmp' '$DEPLOY_PATH/version.json' && chmod 644 '$DEPLOY_PATH/version.json'"

      - name: Verify deployed manifest
        if: env.SKIP_DEPLOY != 'true'
        run: |
          set -euo pipefail
          curl -fsS "https://caloriediary.aetherstudio.cn/version.json" -o remote-version.json
          local_version=$(jq -r .version version.json)
          local_code=$(jq -r .versionCode version.json)
          jq -e --arg v "$local_version" --argjson c "$local_code" '.version == $v and .versionCode == $c' remote-version.json > /dev/null
          download_url=$(jq -r .downloadUrl remote-version.json)
          curl -fsSI "$download_url" | head -n 1
          echo "线上 version.json 已更新：$(jq -c '{version,versionCode,size,sha256,downloadUrl}' remote-version.json)"
