name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      VISION_PROXY_URL: ${{ vars.VISION_PROXY_URL || secrets.VISION_PROXY_URL }}
      VISION_APP_KEY: ${{ vars.VISION_APP_KEY || secrets.VISION_APP_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CalorieDiary-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
