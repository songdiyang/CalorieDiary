name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      VISION_PROXY_URL: ${{ vars.VISION_PROXY_URL || secrets.VISION_PROXY_URL }}
      VISION_APP_KEY: ${{ vars.VISION_APP_KEY || secrets.VISION_APP_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CalorieDiary-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish APK Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v8
        with:
          name: CalorieDiary-debug-${{ github.run_number }}
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: latest-build
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          asset=release/app-debug.apk
          test -s "$asset"
          mv "$asset" release/CalorieDiary-debug.apk
          asset=release/CalorieDiary-debug.apk
          checksum=$(sha256sum "$asset" | cut -d' ' -f1)
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            printf '自动构建的 Debug APK（非商店正式版）。\n\n'
            printf '提交: %s\n' "$GITHUB_SHA"
            printf 'SHA-256: %s\n' "$checksum"
            printf '构建记录: %s\n\n' "$run_url"
            printf '每次 main 构建成功后，本 Release 与 APK 会自动更新。\n'
          } > release/notes.md
          title="最新自动构建 #${RUN_NUMBER}（Debug）"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" --clobber
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file release/notes.md --latest
          else
            gh release create "$RELEASE_TAG" "$asset" --target "$GITHUB_SHA" --title "$title" --notes-file release/notes.md --latest
          fi
